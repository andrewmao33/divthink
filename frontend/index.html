<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- A plain image as well: search engines and phones want a square picture
         of a known size, and not all of them read the SVG. -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The colour phones give the browser bar: the page's own background. -->
    <meta name="theme-color" content="#1d1b18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
    <!-- The window's own background, set before anything else loads so the
         page never opens with a flash of white. Every page is dark. The script
         below marks the public pages (the policy, or the home page when nobody
         is signed in: Supabase keeps the sign-in under an "sb-…-auth-token"
         key), which scroll; SiteShell.tsx keeps the class in step once the app
         is running. -->
    <style>
      html,
      body {
        background: #1d1b18;
      }
      /* Keep the scrollbar's strip of width set aside even on a page too short
         to scroll. Otherwise a long page is narrower than a short one by the
         width of the scrollbar, and everything centred shifts between them. */
      html.site-dark {
        scrollbar-gutter: stable;
      }
    </style>
    <script>
      try {
        var path = location.pathname.replace(/\/$/, '')
        var signedIn = Object.keys(localStorage).some(function (key) {
          return /^sb-.*-auth-token$/.test(key)
        })
        var isDemo = location.search.indexOf('demo=') !== -1
        var sitePages = ['/privacy', '/privacy.html']
        if (sitePages.indexOf(path) !== -1 || (!signedIn && !isDemo)) {
          document.documentElement.classList.add('site-dark')
        }
      } catch (e) {}
    </script>
    <title>Divthink</title>
    <meta
      name="description"
      content="Divthink is a canvas for AI conversations that branch instead of scrolling. Branch from any reply, keep threads side by side, and merge them back. Works with Claude and Gemini."
    />
    <link rel="canonical" href="https://divthink.com/" />

    <!-- Link previews: the title, description and picture a link to the site
         shows on X, iMessage, Slack and the like. The picture's address must be
         a full one; those services don't resolve a bare path. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://divthink.com/" />
    <meta property="og:site_name" content="Divthink" />
    <meta property="og:title" content="Divthink: conversations that branch instead of scrolling" />
    <meta
      property="og:description"
      content="Branch from any reply, keep threads side by side, and merge them back."
    />
    <meta property="og:image" content="https://divthink.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Divthink logo, a line drawing of a head, beside the name Divthink." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://divthink.com/og.jpg" />

    <!-- Tells search engines what the site is called, so results show
         "Divthink" above the link instead of the bare address. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Divthink",
        "url": "https://divthink.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: counts page visits, no cookies. Loaded only on
         the real site, so local development doesn't show up as visits. -->
    <script>
      if (location.hostname === 'divthink.com') {
        var beacon = document.createElement('script')
        beacon.defer = true
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        beacon.setAttribute('data-cf-beacon', '{"token": "93e4d458494f40e8ad674f5678961a92"}')
        document.body.appendChild(beacon)
      }
    </script>
  </body>
</html>
