<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet" />
    <title>DivThink</title>
    <meta
      name="description"
      content="DivThink is a canvas for conversations that branch instead of scrolling. Branch from any reply, follow several threads side by side, then merge them back."
    />
    <link rel="canonical" href="https://divthink.com/" />

    <!-- Link previews. summary rather than summary_large_image until there is a
         real og:image: a large card with no picture looks broken, a small one
         doesn't. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://divthink.com/" />
    <meta property="og:title" content="DivThink" />
    <meta
      property="og:description"
      content="A canvas for conversations that branch instead of scrolling."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
